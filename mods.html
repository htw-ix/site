<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mods — ChiliadMods</title>
<meta name="description" content="ChiliadMods mods for GTA V — open source, MIT license.">
<meta name="theme-color" content="#0F1216">
<link rel="preload" href="fonts/Comfortaa-Variable.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="fonts/Unbounded-Variable.ttf" as="font" type="font/ttf" crossorigin>
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="apple-touch-icon" href="images/logo_180x180.webp">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="mods">
<div class="page">
<header class="top">
  <a class="brand" href="index.html">
    <span>CHILIAD&nbsp;MODS</span>
  </a>
  <nav class="nav">
    <a href="index.html" data-i18n="nav.home"></a>
    <a class="on" href="mods.html" data-i18n="nav.mods"></a>
    <a href="about.html" data-i18n="nav.about"></a>
    <a href="contacts.html" data-i18n="nav.contacts"></a>
  </nav>
  <div class="lang-switch" id="langSwitch">
    <button data-setlang="ru">RU</button>
    <button data-setlang="en">EN</button>
  </div>
</header>
<main>
  <section class="head">
    <img class="anim" style="--d:.1s" src="images/icons/wrench.svg" alt="" width="40" height="40">
    <h1 class="anim" style="--d:.2s" data-i18n="mods.title"></h1>
    <p class="sub anim" style="--d:.3s" data-i18n="mods.sub"></p>
  </section>
  <section class="cards single">
    <article class="mod-card anim" style="--d:.4s">
      <img class="banner" src="images/banner_1280x720.webp" srcset="images/banner_1280x720.webp 1280w, images/banner_1920x1080.webp 1920w" sizes="(min-width: 760px) 780px, 92vw" alt="Random Events Controller">
      <h2 data-i18n="mods.card1.title"></h2>
      <p data-i18n="mods.card1.desc"></p>
      <span class="status" data-i18n="mods.card1.status"></span>
    </article>
  </section>
  <section class="note-panel anim" style="--d:.5s">
    <p data-i18n="mods.note"></p>
    <a class="btn ghost sm" href="https://github.com/htw-ix" target="_blank" rel="noopener"><img src="images/icons/github.svg" alt=""><span data-i18n="mods.gh.link"></span></a>
  </section>
</main>
<footer>
  <img src="images/icons/diamond.svg" alt="">
  <p data-i18n="footer.tag"></p>
  <img src="images/icons/diamond.svg" alt="">
  <p class="fine"><span data-i18n="footer.license"></span> · © 2026 ChiliadMods</p>
</footer>
</div>
<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
</body>
</html>
