<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacts — ChiliadMods</title>
<meta name="description" content="Official channels of ChiliadMods — GitHub, GTA5-Mods, Nexus Mods.">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="apple-touch-icon" href="images/logo_180x180.webp">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contacts">
<div class="page">
<header class="top">
  <a class="brand" href="index.html">
    <span>CHILIAD&nbsp;MODS</span>
  </a>
  <nav class="nav">
    <a href="index.html" data-i18n="nav.home"></a>
    <a href="mods.html" data-i18n="nav.mods"></a>
    <a href="about.html" data-i18n="nav.about"></a>
    <a class="on" href="contacts.html" data-i18n="nav.contacts"></a>
  </nav>
  <div class="lang-switch" id="langSwitch">
    <button data-setlang="ru">RU</button>
    <button data-setlang="en">EN</button>
  </div>
</header>
<main>
  <section class="head">
    <img class="anim" style="--d:.1s" src="images/icons/mail.svg" alt="" width="40" height="40">
    <h1 class="anim" style="--d:.2s" data-i18n="contacts.title"></h1>
    <p class="sub anim" style="--d:.3s" data-i18n="contacts.sub"></p>
  </section>
  <section class="contact-cards">
    <article class="contact-card anim" style="--d:.4s">
      <img class="ic" src="images/icons/github.svg" alt="">
      <h2 data-i18n="contacts.gh.t"></h2>
      <p data-i18n="contacts.gh.d"></p>
      <a class="btn ghost sm" href="https://github.com/chiliadmods" target="_blank" rel="noopener"><span>github.com/chiliadmods</span><img class="arr" src="images/icons/arrow.svg" alt=""></a>
    </article>
    <article class="contact-card anim" style="--d:.5s">
      <img class="ic" src="images/icons/globe.svg" alt="">
      <h2 data-i18n="contacts.g5.t"></h2>
      <p data-i18n="contacts.g5.d"></p>
      <span class="status idea" data-i18n="contacts.soon"></span>
    </article>
    <article class="contact-card anim" style="--d:.6s">
      <img class="ic" src="images/icons/diamond.svg" alt="">
      <h2 data-i18n="contacts.nx.t"></h2>
      <p data-i18n="contacts.nx.d"></p>
      <span class="status idea" data-i18n="contacts.soon"></span>
    </article>
    <article class="contact-card anim" style="--d:.7s">
      <img class="ic" src="images/icons/mail.svg" alt="">
      <h2 data-i18n="contacts.bug.t"></h2>
      <p data-i18n="contacts.bug.d"></p>
      <a class="btn ghost sm" href="https://github.com/chiliadmods" target="_blank" rel="noopener"><span data-i18n="contacts.bug.link"></span><img class="arr" src="images/icons/arrow.svg" alt=""></a>
    </article>
  </section>
</main>
<footer>
  <img src="images/icons/diamond.svg" alt="">
  <p data-i18n="footer.tag"></p>
  <img src="images/icons/diamond.svg" alt="">
  <p class="fine"><span data-i18n="footer.license"></span> · © 2026 ChiliadMods</p>
</footer>
</div>
<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
</body>
</html>
